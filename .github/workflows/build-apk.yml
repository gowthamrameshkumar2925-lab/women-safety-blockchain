name: Build Android APK

on:
  push:
    branches:
      - main 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get
        working-directory: women_safety_app/flutter_app

      - name: Build APK
        run: flutter build apk --release
        working-directory: women_safety_app/flutter_app

      - name: Upload APK file
        uses: actions/upload-artifact@v3
        with:
          name: WomenSafetyApp-APK
          path: women_safety_app/flutter_app/build/app/outputs/flutter-apk/app-release.apk
